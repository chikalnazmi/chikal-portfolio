<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBF0F4" />
      <stop offset="60%" stop-color="#F5D3DC" />
      <stop offset="100%" stop-color="#BD5871" />
    </radialGradient>
    <radialGradient id="centerGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFE873" />
      <stop offset="70%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#893941" />
    </radialGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#253521" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Soft Sage Leaf Backdrop -->
  <g opacity="0.95">
    <path d="M12 44 C8 32 20 22 28 26 C22 36 20 46 12 44 Z" fill="#94AB8B" />
    <path d="M52 44 C56 32 44 22 36 26 C42 36 44 46 52 44 Z" fill="#455E3F" />
    <path d="M48 18 C56 12 58 24 50 28 C46 22 46 16 48 18 Z" fill="#94AB8B" opacity="0.8" />
  </g>

  <!-- Flower Petals (Rose Botanical Bloom) -->
  <g filter="url(#softShadow)">
    <!-- Outer Petals -->
    <path d="M32 6 C26 14 26 24 32 28 C38 24 38 14 32 6 Z" fill="#BD5871" />
    <path d="M32 58 C26 50 26 40 32 36 C38 40 38 50 32 58 Z" fill="#A6435B" />
    <path d="M6 32 C14 26 24 26 28 32 C24 38 14 38 6 32 Z" fill="#BD5871" />
    <path d="M58 32 C50 26 40 26 36 32 C40 38 50 38 58 32 Z" fill="#A6435B" />

    <!-- Diagonal Soft Blush Petals -->
    <path d="M14 14 C22 18 25 27 20 31 C15 27 10 22 14 14 Z" fill="#F5D3DC" opacity="0.95" />
    <path d="M50 14 C42 18 39 27 44 31 C49 27 54 22 50 14 Z" fill="#F5D3DC" opacity="0.95" />
    <path d="M14 50 C22 46 25 37 20 33 C15 37 10 42 14 50 Z" fill="#F5D3DC" opacity="0.95" />
    <path d="M50 50 C42 46 39 37 44 33 C49 37 54 42 50 50 Z" fill="#F5D3DC" opacity="0.95" />

    <!-- Inner Rich Floral Rosette -->
    <circle cx="32" cy="32" r="13" fill="url(#roseGlow)" />
    <path d="M25 29 C28 24 36 24 39 29 C37 35 27 35 25 29 Z" fill="#781E34" opacity="0.75" />
    <path d="M27 35 C30 38 34 38 37 35 C35 32 29 32 27 35 Z" fill="#BD5871" />

    <!-- Golden Pistil Core -->
    <circle cx="32" cy="32" r="5" fill="url(#centerGlow)" />
    <circle cx="30.5" cy="30.5" r="1.2" fill="#FFFFFF" opacity="0.9" />
  </g>

  <!-- Little Sparkle/Pollen Accents -->
  <circle cx="43" cy="18" r="1.5" fill="#FFE873" opacity="0.85" />
  <circle cx="21" cy="45" r="1.2" fill="#F5D3DC" opacity="0.9" />
</svg>
